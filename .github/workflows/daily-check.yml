# Unit tests on every push; once a day (and on demand) a live check of the AI, AliExpress and the server.
# A failure makes GitHub email the repo owner, so a broken dependency (e.g. a deprecated AI model) is caught within a day.
name: Daily check

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *" # 08:00 Israel time
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  live:
    if: github.event_name != 'push'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
          SERVER_URL: https://panda-ali-bot.onrender.com
