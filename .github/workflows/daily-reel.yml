# The morning style-3 Reel (scripts/daily-reel.js): finds a hit product with the seller's own video, Gemini (free tier)
# watches it and writes the Hebrew script, Gemini TTS speaks it, Whisper times the words (~0.2¢), reels/style3.py renders,
# and the owner gets it through the Reels approve bot with the publish / skip buttons, then what is said and the private
# message for commenters. Nothing good today: a short note. Nothing is published without the owner's press.
# 03:00 UTC = 05:00 Israel winter time (06:00 summer): GitHub may start it late, it still arrives in the morning.
name: Daily reel

on:
  push: # temporary: the first real run on the test branch (removed before merging)
    branches: [test/reel-style3]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      product:
        description: "Make the reel for this product id (empty: the best seller with a seller video found today)"
        type: string
        default: ""
      dry:
        description: "Build only: send nothing, keep the reel state (the video is in the run's artifacts)"
        type: boolean
        default: false

concurrency: daily-reel

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install ffmpeg and the Heebo font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          mkdir -p ~/.local/share/fonts && cp reels/fonts/Heebo-VariableFont_wght.ttf ~/.local/share/fonts/ && fc-cache -f
          fc-list | grep -q Heebo || { echo "Heebo font not installed"; exit 1; }
          ffmpeg -version | head -1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable)"; echo "chrome: $CHROME"; "$CHROME" --version
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
      # Free checks before any AI call: Chrome renders a Hebrew pill and ffmpeg has every filter the build uses.
      - name: Preflight
        run: |
          printf '<html><body style="margin:0;background:#fff;font:800 54px Heebo">\xd7\xa4\xd7\xa0\xd7\x93\xd7\x94</body></html>' > /tmp/p.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --window-size=300,100 --screenshot=/tmp/p.png file:///tmp/p.html
          test -s /tmp/p.png
          for f in zoompan xfade gblur tpad alimiter ebur128 amix adelay minterpolate sidechaincompress cropdetect alphaextract; do ffmpeg -hide_banner -filters | grep -qw "$f" || { echo "ffmpeg has no $f"; exit 1; }; done
      - uses: actions/cache/restore@v4
        with:
          path: reels-state.json
          key: reels-state-${{ github.run_id }}
          restore-keys: reels-state-
      - name: Make and send the reel
        id: reel
        run: node scripts/daily-reel.js
        env:
          REEL_PRODUCT: ${{ inputs.product }}
          REEL_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry }}
          REELS_BOT_TOKEN: ${{ secrets.REELS_BOT_TOKEN }}
          DEALS_OWNER_ID: ${{ secrets.DEALS_OWNER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # script, frames and voice (free tier)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # Whisper word times, ~0.2¢
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
      # Saved only when the reel reached the owner (the script says sent=true only then); a cache entry is immutable,
      # so each run saves a new one and the next run restores the newest.
      - uses: actions/cache/save@v4
        if: steps.reel.outputs.sent == 'true'
        with:
          path: reels-state.json
          key: reels-state-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel
          path: |
            reel-out/*.mp4
            reel-out/*.png
            reel-out/*.txt
            reel-out/*/spec.json
            reel-out/*/product.json
            reel-out/*/script-*.json
            reel-out/*/words.json
          retention-days: 14
