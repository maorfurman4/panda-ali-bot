# The daily-deals bot: runs every hour and posts a best-selling AliExpress deal at the posting hours (Israel time, see
# SCHEDULE in deals.js: 5 a day, 7 on sale days, 10 on the big shopping days). No server; a failed run emails the owner.
# GitHub may start a scheduled run up to ~30 minutes late. A manual run ("Run workflow") posts at once.
name: Daily deals

on:
  schedule:
    - cron: "2 6-19 * * *" # every hour, 08:02-21:02 Israel winter time, 09:02-22:02 summer time
  workflow_dispatch:

concurrency: daily-deals # two runs at once could post the same item

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Posted product ids + last topic, carried from run to run (a cache entry is immutable, so each run saves a new one).
      - uses: actions/cache@v4
        with:
          path: deals-state.json
          key: deals-state-${{ github.run_id }}
          restore-keys: deals-state-
      - name: Post a deal
        # Until the owner adds the new bot's secrets, skip quietly (a dry run would only spend AI money).
        run: |
          if [ -z "$DEALS_BOT_TOKEN" ]; then echo "DEALS_BOT_TOKEN not set yet; skipping"; exit 0; fi
          npm run deal
        env:
          DEALS_BOT_TOKEN: ${{ secrets.DEALS_BOT_TOKEN }}
          DEALS_CHAT_ID: ${{ secrets.DEALS_CHAT_ID }}
          DEALS_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
