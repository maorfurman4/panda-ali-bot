# The daily-deals bot: runs every hour and posts a best-selling AliExpress deal at the posting hours (Israel time, see
# SCHEDULE in deals.js: 7 a day, 9 on sale days, 13 on the big shopping days). No server; a failed run emails the owner.
# GitHub may start a scheduled run up to ~30 minutes late. A manual run ("Run workflow") posts at once.
name: Daily deals

on:
  schedule:
    - cron: "2 5-21 * * *" # backup: every hour, 07:02-23:02 Israel winter time, 08:02-00:02 summer time
  # Also started on the hour by cron-job.org through the API with force=false: GitHub's own schedule can be late or skip
  # (no scheduled run at all in the first 2 hours, 2026-10-30). Whichever comes first posts; the other sees the hour taken.
  workflow_dispatch:
    inputs:
      force:
        description: "Post now, whatever the hour"
        type: boolean
        default: true
      special:
        description: "Post a special now: set, sun, wed, fri or holiday (empty: the usual post)"
        type: string
        default: ""

concurrency: daily-deals # two runs at once could post the same item

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Posted product ids + last topic, carried from run to run (a cache entry is immutable, so each run saves a new one).
      - uses: actions/cache@v4
        with:
          path: deals-state.json
          key: deals-state-${{ github.run_id }}
          restore-keys: deals-state-
      - name: Post a deal
        # Until the owner adds the new bot's secrets, skip quietly (a dry run would only spend AI money).
        run: |
          if [ -z "$DEALS_BOT_TOKEN" ]; then echo "DEALS_BOT_TOKEN not set yet; skipping"; exit 0; fi
          npm run deal
        env:
          DEALS_BOT_TOKEN: ${{ secrets.DEALS_BOT_TOKEN }}
          DEALS_CHAT_ID: ${{ secrets.DEALS_CHAT_ID }}
          DEALS_OWNER_ID: ${{ secrets.DEALS_OWNER_ID }}
          DEALS_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          DEALS_SPECIAL: ${{ inputs.special }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # Claude backup when OpenAI fails (empty: no backup)
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
      # Is the search bot up? (scripts/watch-bot.js) Rides on this hourly run: no extra GitHub minutes. Runs even when the
      # deal step failed; it messages the owner through the deals bot. BOT_TOKEN (optional secret) adds Telegram's check.
      - uses: actions/cache@v4
        if: always()
        with:
          path: bot-watch.json
          key: bot-watch-${{ github.run_id }}
          restore-keys: bot-watch-
      - name: Watch the search bot
        if: always()
        run: node scripts/watch-bot.js
        env:
          SERVER_URL: https://panda-ali-bot.onrender.com
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DEALS_BOT_TOKEN: ${{ secrets.DEALS_BOT_TOKEN }}
          DEALS_OWNER_ID: ${{ secrets.DEALS_OWNER_ID }}
